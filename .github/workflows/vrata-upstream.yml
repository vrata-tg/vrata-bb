name: Vrata Upstream

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vrata-upstream
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'vrata-tg/vrata-bb'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
    steps:
      - name: Check upstream update credential
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set UPSTREAM_UPDATE_TOKEN with Contents, Workflows, Pull requests, and Actions write permissions; the built-in GITHUB_TOKEN cannot push upstream workflow changes."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.UPSTREAM_UPDATE_TOKEN }}
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node vrata/update-upstream.mjs
