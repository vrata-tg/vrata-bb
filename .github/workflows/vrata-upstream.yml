name: Vrata Upstream

on:
  schedule:
    - cron: "27 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: vrata-upstream
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'vrata-tg/vrata-bb'
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22.19.0
          package-manager-cache: false
      - run: npm install --global pnpm@9.15.0 --ignore-scripts
      - name: Resolve pinned plugin
        id: plugin
        run: node vrata/plugin-source.mjs >> "$GITHUB_OUTPUT"
      - name: Fetch plugin repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ${{ steps.plugin.outputs.repository }}
          ref: ${{ steps.plugin.outputs.commit }}
          path: vrata/plugin
          ssh-key: ${{ secrets.VRATA_PLUGIN_DEPLOY_KEY }}
          persist-credentials: false
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
      - run: node vrata/update-upstream.mjs
